<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <title>Տոկոսի Հաշվիչ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(to right, #e0f7fa, #fce4ec);
      padding: 40px 20px;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background-color: white;
      border-radius: 20px;
      padding: 30px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }
    h2 {
      text-align: center;
      color: #00796b;
      margin-bottom: 20px;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      font-size: 16px;
      border-radius: 12px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    button {
      background-color: #00796b;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s;
      border: none;
    }
    button:hover {
      background-color: #004d40;
    }
    #result {
      font-weight: bold;
      text-align: center;
      margin-top: 20px;
      color: #d81b60;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Տոկոսի Հաշվիչ</h2>
    <input type="number" id="number" placeholder="Մուտքագրեք թիվը">
    <input type="number" id="percent" placeholder="Մուտքագրեք տոկոսը">
    <button onclick="calculate()">Հաշվել</button>
    <p id="result"></p>
  </div>

  <script>
    function calculate() {
      const number = parseFloat(document.getElementById('number').value);
      const percent = parseFloat(document.getElementById('percent').value);

      const resultElement = document.getElementById('result');

      if (isNaN(number) || isNaN(percent)) {
        resultElement.innerText = "Խնդրում ենք մուտքագրել ճիշտ տվյալներ։";
        return;
      }

      const result = (number * percent) / 100;
      resultElement.innerText = `${number}-ի ${percent}% -ը հավասար է ${result}`;
    }
  </script>
</body>
</html>
